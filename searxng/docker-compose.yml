# SearXNG - Privacy-focused metasearch engine
# Runs on Mini PC (Ubuntu Server)

services:
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
    environment:
      # Overrides server.secret_key in settings.yml. Generate one with:
      #   openssl rand -hex 32
      # (The entrypoint only auto-generates a secret when settings.yml does
      # not exist; since we ship one, set it explicitly.)
      SEARXNG_SECRET: "changeme-put-a-long-random-secret-here"
      SEARXNG_BASE_URL: "http://localhost:8080/"
      SEARXNG_VALKEY_URL: "valkey://searxng-valkey:6379/0"
      TZ: "America/Sao_Paulo"
    depends_on:
      - valkey
    networks:
      - searxng-net
    deploy:
      resources:
        limits:
          memory: 512M

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - searxng-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  # Explicit name so the co-located Vane (perplexica) compose can join it as
  # an external network and reach SearXNG at http://searxng:8080.
  searxng-net:
    name: searxng-net
    driver: bridge

volumes:
  valkey-data: