---
- name: Install base packages
  package:
    name:
      - git
      - curl
      - ca-certificates
    state: present

- name: Install Docker engine and compose plugin (Debian/Ubuntu)
  block:
    - name: Install Docker prerequisites
      apt:
        name:
          - apt-transport-https
          - gnupg
          - python3-docker
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        update_cache: true

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
  when: ansible_os_family == "Debian"

- name: Install Docker engine and compose plugin (Arch)
  pacman:
    name:
      - docker
      - docker-compose
      - docker-buildx
      - python-docker
    state: present
  when: ansible_os_family == "Archlinux"

- name: Install NVIDIA Container Toolkit (desktop)
  pacman:
    name: nvidia-container-toolkit
    state: present
  when:
    - ansible_os_family == "Archlinux"
    - install_nvidia_toolkit | default(false)
  register: nvidia_toolkit

- name: Restart Docker after NVIDIA toolkit install
  systemd:
    name: docker
    state: restarted
  when: nvidia_toolkit is changed

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Allow SSH user to run Docker without sudo
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true