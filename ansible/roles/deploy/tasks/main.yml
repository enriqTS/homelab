---
- name: Clone or update the homelab repository
  git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_path }}"
    version: "{{ repo_branch | default('main') }}"
    force: true
    update: true

- name: Check whether TeamSpeak database credentials exist
  ansible.builtin.stat:
    path: "{{ repo_path }}/teamspeak/.env"
  register: teamspeak_env
  when: "'teamspeak' in deploy_stacks"

- name: Generate TeamSpeak database credentials
  ansible.builtin.command: >-
    {{ ansible_python.executable | default('/usr/bin/python3') }} -c
    "import secrets; print('TEAMSPEAK_DB_PASSWORD=' + secrets.token_urlsafe(32)); print('MARIADB_ROOT_PASSWORD=' + secrets.token_urlsafe(32))"
  register: teamspeak_generated_credentials
  changed_when: false
  no_log: true
  when:
    - "'teamspeak' in deploy_stacks"
    - not teamspeak_env.stat.exists

- name: Persist TeamSpeak database credentials
  ansible.builtin.copy:
    dest: "{{ repo_path }}/teamspeak/.env"
    content: "{{ teamspeak_generated_credentials.stdout }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - "'teamspeak' in deploy_stacks"
    - not teamspeak_env.stat.exists

- name: Create monitoring data directories with container ownership
  ansible.builtin.file:
    path: "{{ repo_path }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop:
    - path: grafana-stack/data/prometheus
      owner: "65534"
      group: "65534"
    - path: grafana-stack/data/grafana
      owner: "472"
      group: "0"
  when: "'grafana-stack' in deploy_stacks"

- name: Deploy compose stacks in order
  community.docker.docker_compose_v2:
    project_src: "{{ repo_path }}/{{ item }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 120
  loop: "{{ deploy_stacks }}"