---
all:
  vars:
    repo_url: https://github.com/enriqTS/homelab.git
    repo_branch: main
    repo_path: /opt/homelab
  children:
    pihole:
      hosts:
        raspberrypi:
          ansible_host: 192.168.1.10
          ansible_user: pi
      vars:
        deploy_stacks:
          - pi-hole
    minipc:
      hosts:
        # henrique-notebook is the Ansible control machine and Mini PC target.
        notebook:
          ansible_user: henrique
          ansible_connection: local
      vars:
        # Start services that migrated away from legacy ports before their
        # replacements claim those ports. Vane depends on SearXNG's network.
        deploy_stacks:
          - nginx-proxy
          - searxng
          - perplexica
          - grafana-stack
          - homepage
          - portainer
          - teamspeak
    desktop:
      hosts:
        # Native Tailscale/MagicDNS endpoint for the LLM host.
        desktop_host:
          ansible_host: henrique-desktop.tail640e58.ts.net
          ansible_user: henrique
      vars:
        install_nvidia_toolkit: true
        deploy_stacks:
          - llm-stack/ollama
          - llm-stack/open-webui
        ollama_models:
          - qwen3.8
          - lfm2.5
          - embeddinggemma
        ollama_remove_models:
          - gemma4:e2b
