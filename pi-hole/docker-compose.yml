# Pi-hole - DNS/Ad-blocking
# Runs on Raspberry Pi

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "8081:80/tcp"   # Admin UI
    environment:
      TZ: "America/Sao_Paulo"
      FTLCONF_dns_port: 53
      # Set a password for the admin interface
      # Use: docker exec -it pihole pihole -a -p
      Pihole_IPV4_ADDRESS: 0.0.0.0
      # Optional: blocklists
      # Gravity list URLs are built-in by default
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq:/etc/dnsmasq.d
    dns:
      - 127.0.0.1
    restart: unless-stopped
    networks:
      - pihole-network
    cap_add:
      - NET_ADMIN

networks:
  pihole-network:
    driver: bridge
