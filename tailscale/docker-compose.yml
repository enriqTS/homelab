# Tailscale - VPN/Mesh Network
# Runs on all nodes (Pi, Mini PC, Desktop)

services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    restart: unless-stopped
    volumes:
      - ./tailscale/var-lib-tailscale:/var/lib/tailscale
      - ./tailscale/dev-net-tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    networks:
      - tailscale-network

networks:
  tailscale-network:
    driver: bridge
