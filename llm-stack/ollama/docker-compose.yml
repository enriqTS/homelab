# Ollama - Local LLM runtime
# Runs on Desktop (46GB RAM)

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    # Docker is enabled at boot on the desktop; "always" brings Ollama back
    # even after a manual stop followed by a Docker daemon/host restart.
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA_DIR:-./ollama}:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
      # Keep Vane's generation and embedding models resident together. A third
      # model, or GPU-memory pressure, causes Ollama to unload a resident model.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Ollama otherwise defaults this GPU to 4K, which is too small for
      # repository-scale agent prompts. 64K fits within the ~11.3GB usable VRAM
      # (KV cache ~1.7GB with q8_0) while leaving margin for weights and buffers.
      OLLAMA_CONTEXT_LENGTH: "65536"
      # Clients do not emit a reliable "model deselected" event. Unload the
      # inactive model after this idle period instead.
      OLLAMA_KEEP_ALIVE: 5m
      # Speed optimizations that preserve output quality. Flash attention
      # shrinks the KV cache and accelerates attention; q8_0 quantizes the KV
      # cache near-losslessly. Both free VRAM so more model layers fit on GPU.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 32G
